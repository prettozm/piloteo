services:
  piloteo:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Production: garder Pilotéo derrière le reverse proxy HTTPS du SI.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
