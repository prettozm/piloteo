name: Déployer Pilotéo (mode solo) sur GitHub Pages

# Construit une coquille statique du mode SOLO (aucun serveur, données locales
# au navigateur) et la publie sur GitHub Pages. Le serveur V1 n'est pas concerné.
#
# Activation (une seule fois) : dépôt → Settings → Pages → « Build and deployment »
# → Source : « GitHub Actions ». Puis lancer ce workflow (onglet Actions →
# « Run workflow ») ou pousser sur une branche déclencheuse.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - claude/piloteo-archive-local-first-ozmi9k
    paths:
      - "index.html"
      - "app.js"
      - "local-backend.js"
      - "piloteo-solo-bridge.mjs"
      - "piloteo-org-bridge.mjs"
      - "piloteo-drive-bridge.mjs"
      - "src/**"
      - "sw-solo.js"
      - "seed.json"
      - "manifest.webmanifest"
      - "assets/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assembler la coquille solo
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html app.js piloteo-events.js local-backend.js sw-solo.js manifest.webmanifest _site/
          # Point 1b : le pont mode Dossier est un module ES qui importe src/*
          # (event-log, reducer, storage...) — les deux doivent être servis en
          # statique pour que le mode Dossier soit utilisable sur le site déployé.
          cp piloteo-solo-bridge.mjs _site/
          # Point 2c-C2 : idem pour le pont mode Organisation (importe aussi src/*,
          # déjà copié ci-dessous — aucune duplication de dossier nécessaire).
          cp piloteo-org-bridge.mjs _site/
          # Point 4 : idem pour le pont mode Google Drive (écriture vive) — même
          # raison (module ES important src/*, déjà copié ci-dessous).
          cp piloteo-drive-bridge.mjs _site/
          # Point 5 (migration à la bascule) + Point 3 (session/auth) : ces deux
          # ponts ES sont AUSSI chargés par index.html -> sans eux, 404 au boot.
          cp piloteo-migration-bridge.mjs _site/
          cp piloteo-auth-bridge.mjs _site/
          mkdir -p _site/src
          cp -r src/. _site/src/
          # Seed PUBLIC neutre : aucune donnée personnelle sur le site déployé.
          cp deploy/seed.public.json _site/seed.json
          cp assets/logo-default.svg _site/assets/ 2>/dev/null || true
          # Forcer le mode solo par défaut (pas besoin de ?solo=1 sur le site déployé).
          # On insère le drapeau juste avant le chargement de local-backend.js.
          python3 - <<'PY'
          import io, pathlib
          p = pathlib.Path("_site/index.html")
          html = p.read_text(encoding="utf-8")
          needle = '<script src="local-backend.js"></script>'
          inject = '<script>window.PILOTEO_FORCE_SOLO=true;</script>\n' + needle
          if needle in html and 'PILOTEO_FORCE_SOLO' not in html:
              html = html.replace(needle, inject, 1)
          p.write_text(html, encoding="utf-8")
          print("force-solo injecté")
          PY
      - name: Garde-fou — chaque asset local d'index.html existe dans _site
        run: |
          set -eu
          python3 - <<'PY'
          import re, pathlib, sys
          site = pathlib.Path("_site")
          html = (site / "index.html").read_text(encoding="utf-8")
          # src="..." et import ... from "..." locaux (hors http(s)://, data:, #, //)
          refs = set(re.findall(r'src=["\']([^"\']+)["\']', html))
          refs |= set(re.findall(r'from\s+["\']([^"\']+)["\']', html))
          missing = []
          for r in refs:
              if r.startswith(("http://", "https://", "data:", "//", "#", "mailto:")):
                  continue
              if r.startswith("/"):   # chemins absolus type /brand-logo : routes app, pas des fichiers
                  continue
              if not (site / r).exists():
                  missing.append(r)
          if missing:
              print("ASSETS MANQUANTS dans _site :", missing); sys.exit(1)
          print("Garde-fou OK — tous les assets locaux d'index.html sont présents.")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
