name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Vérifier la syntaxe du serveur
        run: python -m py_compile server.py scripts/restore_backup.py

      - name: Lancer les tests
        run: python -m unittest discover -s tests -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Installer Playwright + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Test E2E navigateur (sécurité XSS + CSP + parcours)
        run: node tests/e2e/smoke.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construire l'image
        run: docker build -t piloteo:ci .

      - name: Démarrer et vérifier le healthcheck
        run: |
          docker run -d --name piloteo-ci \
            -e PILOTEO_ADMIN_USERNAME=admin \
            -e PILOTEO_ADMIN_PASSWORD=mot-de-passe-de-ci-long \
            -e PILOTEO_ADMIN_CONSULTANT_ID=SMR \
            -e PILOTEO_ADMIN_NAME="Admin CI" \
            -p 127.0.0.1:8080:8080 \
            piloteo:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "healthcheck OK"; ok=1; break
            fi
            sleep 1
          done
          docker logs piloteo-ci
          test "${ok:-0}" = "1"

      - name: Vérifier l'arrêt propre (SIGTERM)
        run: |
          # docker stop envoie SIGTERM ; un arrêt propre sort avant le timeout de 10 s.
          start=$(date +%s)
          docker stop piloteo-ci
          end=$(date +%s)
          echo "arrêt en $((end - start)) s"
          test $((end - start)) -lt 10

      - name: Nettoyage
        if: always()
        run: docker rm -f piloteo-ci 2>/dev/null || true

  # Scan de vulnérabilités de l'image (OS + Python). Informatif dans un premier
  # temps : une CVE fraîche dans l'image de base ne doit pas bloquer un correctif
  # applicatif — la traiter reste à l'agenda (dependabot suit l'image de base).
  trivy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Construire l'image
        run: docker build -t piloteo:scan .

      - name: Scan Trivy (CVE HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: piloteo:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
